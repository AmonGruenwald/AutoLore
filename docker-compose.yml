services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/data/db
      - ./data/epubs:/data/epubs
    environment:
      - DB_PATH=/data/db/autolore.db
      - EPUB_STORAGE=/data/epubs
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
